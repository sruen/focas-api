[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focas-engine"
version = "1.1.5"
description = "Integrated FOCAS pre-match, post-match fact library, and historical experience runtime"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["focas_api*", "focas_engine*", "focas_prematch*", "focas_postmatch*", "focas_experience*", "shared*"]

[tool.setuptools.package-data]
focas_engine = ["data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
