openapi: 3.1.0
info:
  title: FOCAS Backend API Contract v1.2-R
  version: 1.2-R
  description: 后端只返回 evidence pack，不输出最终方向、投注建议或赛果倾向。
servers:
  - url: https://focas-api.onrender.com
paths:
  /analyzeFocasMatch:
    post:
      operationId: analyzeFocasMatch
      summary: Build FOCAS evidence pack for a football match
      description: Submit verified pre-match facts and odds. The response is evidence only; GPT must perform final analysis independently.
      x-openai-isConsequential: false
      security:
        - FocasApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocasAnalyzeRequest"
      responses:
        "200":
          description: Evidence-only response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocasAnalyzeResponse"
        "400":
          description: Invalid match input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    FocasApiKey:
      type: http
      scheme: bearer
  schemas:
    FocasAnalyzeRequest:
      type: object
      required:
        - match
        - home_context
        - away_context
        - h2h
        - strength
        - natural_pulls
        - odds
      properties:
        include_report:
          type: boolean
          description: 可选；默认 false。v1.2-R 后端不生成最终方向报告。
        match:
          $ref: "#/components/schemas/Match"
        information_quality:
          $ref: "#/components/schemas/InformationQuality"
        source_reliability:
          $ref: "#/components/schemas/SourceReliability"
        home_context:
          $ref: "#/components/schemas/TeamContext"
        away_context:
          $ref: "#/components/schemas/TeamContext"
        h2h:
          $ref: "#/components/schemas/H2HContext"
        strength:
          $ref: "#/components/schemas/StrengthContext"
        natural_pulls:
          type: array
          items:
            $ref: "#/components/schemas/NaturalPull"
        distribution_lock:
          $ref: "#/components/schemas/DistributionLock"
        narrative_materials:
          type: array
          items:
            $ref: "#/components/schemas/NarrativeMaterial"
        odds:
          type: array
          minItems: 3
          items:
            $ref: "#/components/schemas/CompanyOdds"
      additionalProperties: true
    Match:
      type: object
      required:
        - home_team
        - away_team
      properties:
        home_team:
          type: string
        away_team:
          type: string
        competition:
          type: string
        kickoff_time:
          type: string
        stage:
          type: string
          description: 联赛/杯赛/友谊赛/淘汰赛/小组赛等。
        match_stage:
          type: string
          description: stage 的别名。
        neutral_venue:
          type: boolean
        real_home_away:
          type: boolean
        result_scope:
          type: string
          description: 90分钟/含加时/含点球。
        single_leg:
          type: boolean
        single_match:
          type: boolean
        extra_time_or_penalties:
          type: string
        extra_time_rule:
          type: string
        penalty_rule:
          type: string
        match_type:
          type: string
        information_updated_at:
          type: string
      additionalProperties: true
    InformationQuality:
      type: object
      properties:
        overall_rating:
          type: string
          enum: [A, B, C, D]
        source_time_range:
          type: string
        missing_core_info:
          type: array
          items:
            type: string
        low_confidence_items:
          type: array
          items:
            type: string
        downgrade_reason:
          type: string
        analysis_allowed:
          type: boolean
      additionalProperties: true
    ReliabilityItem:
      type: object
      properties:
        source:
          type: string
        time:
          type: string
        reliability:
          type: string
          enum: [已确认, 较可信, 待确认, 低可信]
      additionalProperties: true
    SourceReliability:
      type: object
      properties:
        rank_points:
          $ref: "#/components/schemas/ReliabilityItem"
        recent_form:
          $ref: "#/components/schemas/ReliabilityItem"
        home_away:
          $ref: "#/components/schemas/ReliabilityItem"
        injuries:
          $ref: "#/components/schemas/ReliabilityItem"
        motivation_schedule:
          $ref: "#/components/schemas/ReliabilityItem"
        h2h:
          $ref: "#/components/schemas/ReliabilityItem"
        tactical_style:
          $ref: "#/components/schemas/ReliabilityItem"
      additionalProperties: true
    TeamContext:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        rank:
          type: string
        points:
          type: string
        recent_matches:
          type: array
          items:
            type: string
        recent_record_summary:
          type: string
        recent_goals_for_against:
          type: string
        venue_adaptation:
          type: string
        attack_state:
          type: string
        defense_state:
          type: string
        injuries:
          type: string
        schedule_fatigue:
          type: string
        motivation:
          type: string
        popularity_story:
          type: string
        tactical_style:
          type: string
      additionalProperties: true
    H2HContext:
      type: object
      properties:
        overall:
          type: string
        recent_years:
          type: string
        same_competition:
          type: string
        venue_specific:
          type: string
        market_psychology:
          type: string
      additionalProperties: true
    StrengthContext:
      type: object
      description: 只能使用固定档位梯子；相邻档位差0.5档，不是1档。
      properties:
        home_grade:
          type: string
          enum: [下游, 中下, 中游, 中上, 中强, 准强, 普强, 人强]
        away_grade:
          type: string
          enum: [下游, 中下, 中游, 中上, 中强, 准强, 普强, 人强]
        static_gap:
          type: string
          description: 静态档差，例如主队高0.5档、客队高一档、双方同档。
        dynamic_adjustment:
          type: string
        final_gap:
          type: string
          description: 动态修正后档差。后端据此桥接 p4_strength_key 与骨架区间。
        uncertainty:
          type: string
      additionalProperties: true
    NaturalPull:
      type: object
      required:
        - direction
      properties:
        direction:
          type: string
          enum: [home, draw, away, 主胜, 平局, 客胜]
        pull_score:
          type: string
          description: -2/-1/0/+1/+2
        strength:
          type: string
          enum: [强, 中, 弱]
        facts:
          type: string
        market_visibility:
          type: string
          enum: [高, 中, 低]
        source_reliability:
          type: string
          enum: [已确认, 较可信, 待确认, 低可信]
        easy_to_receive:
          type: boolean
      additionalProperties: true
    DistributionLock:
      type: object
      properties:
        type:
          type: string
          enum: [顺分布, 逆分布, 中庸分布, 缓冲分布]
        home_pull:
          type: string
        draw_pull:
          type: string
        away_pull:
          type: string
        locked_before_odds:
          type: boolean
        lock_confidence:
          type: string
          enum: [高, 中, 低]
        main_uncertainty:
          type: string
        cannot_reverse_by_odds_only:
          type: boolean
      additionalProperties: true
    NarrativeMaterial:
      type: object
      required:
        - direction
        - topic
      properties:
        direction:
          type: string
          enum: [home, draw, away, 主胜, 平局, 客胜]
        topic:
          type: string
          description: 近况/伤停/战意/赛程/往绩/排名/主客场/战术
        facts:
          type: string
        source:
          type: string
        published_at:
          type: string
        visibility:
          type: string
          enum: [高, 中, 低]
        strength:
          type: string
          enum: [强, 中, 弱]
        reliability:
          type: string
          enum: [已确认, 较可信, 待确认, 低可信]
        institution_use_status:
          type: string
          enum: [可用, 待确认, 低可信不用]
      additionalProperties: true
    CompanyOdds:
      type: object
      required:
        - company
        - initial
        - current
      properties:
        company:
          type: string
          description: William/Ladbrokes/Avg/BetVictor/other
        role:
          type: string
          enum: [core, auxiliary]
        initial:
          $ref: "#/components/schemas/OddsSnapshot"
        current:
          $ref: "#/components/schemas/OddsSnapshot"
        path:
          type: array
          items:
            $ref: "#/components/schemas/OddsPathPoint"
      additionalProperties: true
    OddsSnapshot:
      type: object
      required:
        - home
        - draw
        - away
      properties:
        home:
          type: number
        draw:
          type: number
        away:
          type: number
      additionalProperties: false
    OddsPathPoint:
      type: object
      properties:
        time:
          type: string
        home:
          type: number
        draw:
          type: number
        away:
          type: number
      additionalProperties: true
    FocasAnalyzeResponse:
      type: object
      properties:
        api_schema_version:
          type: string
        engine_version:
          type: string
        backend_scope:
          type: string
          enum: [evidence_only_no_final_direction]
        forbidden_fields:
          type: array
          items:
            type: string
        backend_rules:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/AuditObject"
        match:
          $ref: "#/components/schemas/AuditObject"
        information_quality_flags:
          $ref: "#/components/schemas/AuditObject"
        source_reliability_echo:
          $ref: "#/components/schemas/AuditObject"
        distribution_lock_echo:
          $ref: "#/components/schemas/AuditObject"
        skeleton_route:
          $ref: "#/components/schemas/AuditObject"
        theoretical_ranges:
          $ref: "#/components/schemas/AuditObject"
        initial_odds_audit:
          $ref: "#/components/schemas/AuditObject"
        movement_pack:
          $ref: "#/components/schemas/AuditObject"
        movement_authority_audit:
          $ref: "#/components/schemas/AuditObject"
        scenario_evidence_pack:
          $ref: "#/components/schemas/AuditObject"
        evidence_appendix:
          $ref: "#/components/schemas/AuditObject"
        report_markdown:
          type: string
      additionalProperties: true
    AuditObject:
      type: object
      properties:
        schema_note:
          type: string
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
      additionalProperties: true
