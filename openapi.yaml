openapi: 3.1.0
info:
  title: FOCAS Evidence API
  version: 1.1.5
  description: FOCAS backend evidence provider. It returns odds, skeleton, topic, movement, and scenario audit data only. It does not return a home/draw/away result tendency.
servers:
  - url: https://focas-api.onrender.com
paths:
  /v1/analyze:
    post:
      operationId: analyzeFocasMatch
      summary: Build FOCAS evidence for a football match
      description: Submit pre-match facts and odds. The response is evidence only; GPT must perform the final match analysis.
      x-openai-isConsequential: false
      security:
        - FocasApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocasAnalyzeRequest"
      responses:
        "200":
          description: FOCAS evidence response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocasAnalyzeResponse"
        "400":
          description: Invalid match input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    FocasApiKey:
      type: http
      scheme: bearer
  schemas:
    FocasAnalyzeRequest:
      type: object
      required:
        - match
        - home_context
        - away_context
        - h2h
        - strength
        - natural_pulls
        - odds
      properties:
        include_report:
          type: boolean
          description: Set true only when a long markdown report is needed.
        match:
          $ref: "#/components/schemas/Match"
        home_context:
          $ref: "#/components/schemas/TeamContext"
        away_context:
          $ref: "#/components/schemas/TeamContext"
        h2h:
          $ref: "#/components/schemas/H2HContext"
        strength:
          $ref: "#/components/schemas/StrengthContext"
        natural_pulls:
          type: array
          items:
            $ref: "#/components/schemas/NaturalPull"
        narrative_materials:
          type: array
          items:
            $ref: "#/components/schemas/NarrativeMaterial"
        original_book_mode:
          $ref: "#/components/schemas/OriginalBookMode"
        odds:
          type: array
          minItems: 3
          items:
            $ref: "#/components/schemas/CompanyOdds"
      additionalProperties: true
    Match:
      type: object
      required:
        - home_team
        - away_team
      properties:
        home_team:
          type: string
        away_team:
          type: string
        competition:
          type: string
        kickoff_time:
          type: string
        stage:
          type: string
          description: Match stage, for example International friendly, group stage, league round, semi-final, or final.
        neutral_venue:
          type: boolean
        single_leg:
          type: boolean
          description: Whether this match is a single-leg match. Friendlies should normally be true.
        match_type:
          type: string
        extra_time_or_penalties:
          type: string
          description: Extra-time or penalty rules. For friendlies use no extra time or penalties, 90 minutes only.
        real_home_away:
          type: boolean
        attention_level:
          type: string
      additionalProperties: true
    TeamContext:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        rank:
          type: string
        points:
          type: string
        recent_matches:
          type: array
          items:
            type: string
        venue_adaptation:
          type: string
        attack_state:
          type: string
        defense_state:
          type: string
        injuries:
          type: string
        schedule_fatigue:
          type: string
        motivation:
          type: string
        popularity_story:
          type: string
        major_recent_matches:
          type: string
      additionalProperties: true
    H2HContext:
      type: object
      properties:
        overall:
          type: string
        recent_years:
          type: string
        same_competition:
          type: string
        venue_specific:
          type: string
        latest_key_match:
          type: string
        market_psychology:
          type: string
      additionalProperties: true
    StrengthContext:
      type: object
      properties:
        home_grade:
          type: string
        away_grade:
          type: string
        static_gap:
          type: string
        dynamic_adjustment:
          type: string
        final_gap:
          type: string
        original_distribution:
          type: string
        theoretical_psychological_interval:
          type: string
        theoretical_home_odds_range:
          type: string
        theoretical_draw_odds_reference:
          type: string
        theoretical_away_odds_reference:
          type: string
      additionalProperties: true
    NaturalPull:
      type: object
      required:
        - direction
      properties:
        direction:
          type: string
          description: Use one of home, draw, away, or Chinese equivalents.
        strength:
          type: string
        facts:
          type: string
        market_psychology:
          type: string
        popularity_direction:
          type: string
        easy_to_receive:
          type: boolean
        first_eye_direction:
          type: boolean
      additionalProperties: true
    NarrativeMaterial:
      type: object
      required:
        - direction
        - topic
      properties:
        direction:
          type: string
        topic:
          type: string
        category:
          type: string
        facts:
          type: string
        source:
          type: string
        published_at:
          type: string
        visibility:
          type: string
        strength:
          type: string
        institution_use_status:
          type: string
        institution_use_evidence:
          type: array
          items:
            type: string
        utilization_mode:
          type: string
      additionalProperties: true
    OriginalBookMode:
      type: object
      properties:
        mode:
          type: string
        reason:
          type: string
        key_odds_to_watch:
          type: string
        easiest_misread:
          type: string
        source_classification:
          type: array
          items:
            type: string
      additionalProperties: true
    CompanyOdds:
      type: object
      required:
        - company
        - initial
        - current
      properties:
        company:
          type: string
          description: William, Ladbrokes, Avg, or another company name if supported.
        initial:
          $ref: "#/components/schemas/OddsSnapshot"
        current:
          $ref: "#/components/schemas/OddsSnapshot"
      additionalProperties: true
    OddsSnapshot:
      type: object
      required:
        - home
        - draw
        - away
      properties:
        home:
          type: number
        draw:
          type: number
        away:
          type: number
      additionalProperties: false
    FocasAnalyzeResponse:
      type: object
      properties:
        api_schema_version:
          type: string
        engine_version:
          type: string
        analysis_contract:
          $ref: "#/components/schemas/AuditObject"
        match:
          $ref: "#/components/schemas/AuditObject"
        status:
          $ref: "#/components/schemas/AuditObject"
        expected_opening_interval:
          $ref: "#/components/schemas/AuditObject"
        system_routes:
          type: array
          items:
            $ref: "#/components/schemas/AuditObject"
        skeleton_system_audit:
          type: array
          items:
            $ref: "#/components/schemas/AuditObject"
        opening_skeleton_audits:
          type: array
          items:
            $ref: "#/components/schemas/AuditObject"
        psychological_interval_audit:
          $ref: "#/components/schemas/AuditObject"
        opening_board_audit:
          $ref: "#/components/schemas/AuditObject"
        opening_anchor_audit:
          $ref: "#/components/schemas/AuditObject"
        movement_authority_audit:
          $ref: "#/components/schemas/AuditObject"
        fundamental_topic_audit:
          $ref: "#/components/schemas/AuditObject"
        market_pull_audit:
          $ref: "#/components/schemas/AuditObject"
        optimal_solution_audit:
          $ref: "#/components/schemas/AuditObject"
        bookmaker_topic_usage_audit:
          $ref: "#/components/schemas/AuditObject"
        engine_suggestion:
          $ref: "#/components/schemas/AuditObject"
        final_structure_judgement:
          $ref: "#/components/schemas/AuditObject"
        opening_motive_chain:
          type: array
          items:
            $ref: "#/components/schemas/AuditObject"
        narrative_audit:
          $ref: "#/components/schemas/AuditObject"
        scenario_audit:
          $ref: "#/components/schemas/AuditObject"
        notes:
          type: array
          items:
            type: string
        report_markdown:
          type: string
      additionalProperties: true
    AuditObject:
      type: object
      properties:
        schema_note:
          type: string
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
      additionalProperties: true
