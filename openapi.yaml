openapi: 3.1.0
info:
  title: FOCASGPT Material Audit API
  version: 1.1.6-material
  description: >
    FOCASGPT API tool layer. The API reads odds, routes institution snapshots
    to the 89-96 skeleton sheets, exposes material audits, and verifies GPT's
    independent judgement. It does not select the final match direction. V3.9.1
    and V4 project-source documents remain the judgement layer.
servers:
  - url: https://focas-api.onrender.com

paths:
  /v1/audit:
    post:
      operationId: auditFocasMaterials
      summary: Audit FOCAS match materials without selecting a final direction
      description: >
        Submit normalized match facts, market narratives, and institution odds.
        The response is material-only: GPT must use it as evidence for an
        independent V3.9.1/V4 analysis. Backend final judgement fields are
        scrubbed or marked reference-only and may not anchor the answer.
      x-openai-isConsequential: false
      security:
        - FocasApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocasAuditRequest"
      responses:
        "200":
          description: Material audit response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocasAuditResponse"
        "400":
          description: Invalid match input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/verify:
    post:
      operationId: verifyIndependentJudgement
      summary: Verify GPT independent judgement against audited materials
      description: >
        Submit the material audit and GPT independent judgement. The API checks
        matrix support, missing materials, unresolved vetoes, grade overreach,
        and movement conflicts. It returns ALLOW, DOWNGRADE, REVIEW, or REJECT;
        it does not select a new direction.
      x-openai-isConsequential: false
      security:
        - FocasApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyJudgementRequest"
      responses:
        "200":
          description: Verification response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyJudgementResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/analyze:
    post:
      operationId: analyzeFocasMatchCompatibility
      summary: Compatibility alias for material audit
      description: >
        Backward-compatible alias for /v1/audit. It returns a material audit
        only, not a backend final direction.
      x-openai-isConsequential: false
      security:
        - FocasApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocasAuditRequest"
      responses:
        "200":
          description: Material audit response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocasAuditResponse"
        "400":
          description: Invalid match input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    FocasApiKey:
      type: http
      scheme: bearer

  schemas:
    FocasAuditRequest:
      type: object
      required:
        - match
        - home_context
        - away_context
        - h2h
        - strength
        - natural_pulls
        - odds
      properties:
        include_report:
          type: boolean
          default: false
          description: Return long Markdown report only when explicitly requested.
        match:
          $ref: "#/components/schemas/Match"
        home_context:
          $ref: "#/components/schemas/TeamContext"
        away_context:
          $ref: "#/components/schemas/TeamContext"
        h2h:
          $ref: "#/components/schemas/H2HContext"
        strength:
          $ref: "#/components/schemas/StrengthContext"
        natural_pulls:
          type: array
          items:
            $ref: "#/components/schemas/NaturalPull"
        narrative_materials:
          type: array
          items:
            $ref: "#/components/schemas/NarrativeMaterial"
        original_book_mode:
          $ref: "#/components/schemas/OriginalBookMode"
        odds:
          type: array
          minItems: 3
          items:
            $ref: "#/components/schemas/CompanyOdds"
      additionalProperties: true

    Match:
      type: object
      required:
        - home_team
        - away_team
      properties:
        home_team:
          type: string
        away_team:
          type: string
        competition:
          type: string
        kickoff_time:
          type: string
        stage:
          type: string
        neutral_venue:
          type: boolean
        single_leg:
          type: boolean
        match_type:
          type: string
        real_home_away:
          type: boolean
        attention_level:
          type: string
        league_for_table:
          type: string
      additionalProperties: true

    TeamContext:
      type: object
      required:
        - name
        - rank
        - points
        - recent_matches
      properties:
        name:
          type: string
        rank:
          type: string
          description: Ranking context. For national teams, use FIFA ranking.
        points:
          type: string
          description: Points context. For national teams or friendlies, use FIFA points or official group/table points.
        recent_matches:
          type: array
          minItems: 5
          description: At least five pre-match results; every item must start with W, D, or L.
          items:
            type: string
            pattern: "^[WDL]\\s+.+"
        venue_adaptation:
          type: string
        attack_state:
          type: string
        defense_state:
          type: string
        injuries:
          type: string
        schedule_fatigue:
          type: string
        motivation:
          type: string
        popularity_story:
          type: string
        major_recent_matches:
          type: string
      additionalProperties: true

    H2HContext:
      type: object
      properties:
        overall:
          type: string
        recent_years:
          type: string
        same_competition:
          type: string
        venue_specific:
          type: string
        latest_key_match:
          type: string
        market_psychology:
          type: string
      additionalProperties: true

    StrengthContext:
      type: object
      properties:
        home_grade:
          type: string
          enum: [下游, 中下, 中游, 中上, 中强, 准强, 普强, 人强]
        away_grade:
          type: string
          enum: [下游, 中下, 中游, 中上, 中强, 准强, 普强, 人强]
        static_gap:
          type: string
        dynamic_adjustment:
          type: string
        final_gap:
          type: string
        original_distribution:
          type: string
        theoretical_psychological_interval:
          type: string
        theoretical_home_odds_range:
          type: string
        theoretical_draw_odds_reference:
          type: string
        theoretical_away_odds_reference:
          type: string
      additionalProperties: true

    NaturalPull:
      type: object
      required: [direction]
      properties:
        direction:
          type: string
          enum: [主胜, 平局, 客胜]
        strength:
          type: string
        facts:
          type: string
        market_psychology:
          type: string
        popularity_direction:
          type: string
        easy_to_receive:
          type: boolean
        first_eye_direction:
          type: boolean
      additionalProperties: false

    NarrativeMaterial:
      type: object
      required: [direction, topic]
      properties:
        direction:
          type: string
        topic:
          type: string
        category:
          type: string
        facts:
          type: string
        source:
          type: string
        published_at:
          type: string
        visibility:
          type: string
        strength:
          type: string
        strength_alignment:
          type: string
        institution_use_status:
          type: string
        institution_use_evidence:
          type: array
          items:
            type: string
        utilization_mode:
          type: string
      additionalProperties: false

    OriginalBookMode:
      type: object
      properties:
        mode:
          type: string
        reason:
          type: string
        key_odds_to_watch:
          type: string
        easiest_misread:
          type: string
        source_classification:
          type: array
          items:
            type: string
      additionalProperties: true

    CompanyOdds:
      type: object
      required: [company, initial, current]
      properties:
        company:
          type: string
          enum: [William, Ladbrokes, Avg]
        initial:
          $ref: "#/components/schemas/OddsSnapshot"
        current:
          $ref: "#/components/schemas/OddsSnapshot"
      additionalProperties: false

    OddsSnapshot:
      type: object
      required: [home, draw, away]
      properties:
        home:
          type: number
        draw:
          type: number
        away:
          type: number
      additionalProperties: false

    FocasAuditResponse:
      type: object
      properties:
        api_schema_version:
          type: string
        engine_version:
          type: string
        analysis_contract:
          $ref: "#/components/schemas/FreeformObject"
        gpt_execution_gate:
          $ref: "#/components/schemas/FreeformObject"
          description: Material-only reading order. final_output_allowed is always false until GPT independently judges and /v1/verify checks it.
        movement_contradiction_audit:
          type: array
          items:
            $ref: "#/components/schemas/FreeformObject"
        match:
          $ref: "#/components/schemas/FreeformObject"
        status:
          $ref: "#/components/schemas/FreeformObject"
        expected_opening_interval:
          $ref: "#/components/schemas/FreeformObject"
        strength_dynamic_audit:
          $ref: "#/components/schemas/FreeformObject"
        original_distribution_audit:
          $ref: "#/components/schemas/FreeformObject"
        system_routes:
          type: array
          items:
            $ref: "#/components/schemas/FreeformObject"
        skeleton_system_audit:
          type: array
          items:
            $ref: "#/components/schemas/FreeformObject"
        psychological_interval_audit:
          $ref: "#/components/schemas/FreeformObject"
        opening_board_audit:
          $ref: "#/components/schemas/FreeformObject"
        pre_odds_predicted_odds_audit:
          $ref: "#/components/schemas/FreeformObject"
        three_direction_development_matrix:
          type: array
          items:
            $ref: "#/components/schemas/FreeformObject"
        scenario_simulation_reference:
          $ref: "#/components/schemas/FreeformObject"
          description: Scrubbed scenario simulation reference; selected direction is removed.
        bookmaker_topic_usage_audit:
          $ref: "#/components/schemas/FreeformObject"
        backend_reference_judgement:
          $ref: "#/components/schemas/FreeformObject"
          description: Reference-only backend judgement with direction fields scrubbed.
        notes:
          type: array
          items:
            type: string
        report_markdown:
          type: string
      additionalProperties: true

    VerifyJudgementRequest:
      type: object
      required: [audit_payload, independent_judgement]
      properties:
        audit_payload:
          $ref: "#/components/schemas/FreeformObject"
        independent_judgement:
          $ref: "#/components/schemas/IndependentJudgement"
      additionalProperties: false

    IndependentJudgement:
      type: object
      required: [selected_direction, reasoning_summary]
      properties:
        selected_direction:
          type: string
          enum: [主胜, 平局, 客胜, 胜, 平, 负, 胜+平, 平+负, PASS]
        structure_grade:
          type: string
          enum: [A, B, B+, C, PASS]
        excluded_directions:
          type: array
          items:
            type: string
        risk_direction:
          type: string
        opening_anchor_reading:
          type: string
        movement_reading:
          type: string
        optimal_path_adopted:
          type: boolean
        hard_vetoes:
          type: array
          items:
            $ref: "#/components/schemas/FreeformObject"
        reasoning_summary:
          type: string
      additionalProperties: true

    VerifyJudgementResponse:
      type: object
      properties:
        api_schema_version:
          type: string
        verification_contract:
          $ref: "#/components/schemas/FreeformObject"
        verification_status:
          type: string
          enum: [PASS_CHECKED, DOWNGRADED, REVIEW_REQUIRED, REJECT]
        gpt_selected_direction:
          type: string
        direction_allowed:
          type: boolean
        final_output_allowed:
          type: boolean
        max_allowed_grade:
          type: string
        matrix_alignment:
          type: string
        two_direction_exclusion:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/FreeformObject"
        hard_vetoes:
          type: array
          items:
            $ref: "#/components/schemas/FreeformObject"
        required_rewrite_points:
          type: array
          items:
            type: string
      additionalProperties: true

    FreeformObject:
      type: object
      properties:
        schema_note:
          type: string
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
      additionalProperties: true
